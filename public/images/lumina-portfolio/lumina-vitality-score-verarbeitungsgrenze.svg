<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" style="background:#1a1a1a; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Styles -->
  <style>
    .title { fill: #ffffff; font-size: 16px; font-weight: 600; }
    .subtitle { fill: #888888; font-size: 12px; }
    .node-rect { fill: #262626; stroke: #3f3f3f; stroke-width: 1.5; rx: 6px; }
    .node-text { fill: #e5e5e5; font-size: 13px; font-weight: 500; text-anchor: middle; }
    .arrow-line { stroke: #3b82f6; stroke-width: 2; fill: none; }
    .arrow-head { fill: #3b82f6; }
    .boundary-line { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6,4; }
    .boundary-text { fill: #dc2626; font-size: 12px; font-weight: 600; }
    .blocked-line { stroke: #737373; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
    .blocked-text { fill: #a3a3a3; font-size: 11px; }
  </style>
  
  <!-- Definitions for Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-blocked" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Grid or Accents -->
  <rect width="100%" height="100%" fill="#121212" rx="12" />
  
  <!-- Header -->
  <text x="25" y="40" class="title">Verarbeitungsgrenze des Vitality-Score-Rechners</text>
  <text x="25" y="60" class="subtitle">Lumina Praxis Vitality-Score-Rechner – Architektur- und Verarbeitungsgrenzen</text>

  <!-- Client Zone / Browser (Left side) -->
  <rect x="25" y="90" width="480" height="330" fill="#181818" stroke="#2a2a2a" stroke-width="1" rx="8" />
  <text x="45" y="115" fill="#3b82f6" font-size="12" font-weight="600" letter-spacing="1">CLIENT / BROWSER (Lokale Ausführung)</text>
  
  <!-- Node A: Patient / Eingabe -->
  <rect x="75" y="150" width="380" height="50" class="node-rect" />
  <text x="265" y="180" class="node-text">Patient / Formular-Eingabe (Gesundheitswerte)</text>
  
  <!-- Arrow A -> B -->
  <line x1="265" y1="200" x2="265" y2="235" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Node B: Clientseitiger JavaScript-Rechner -->
  <rect x="75" y="245" width="380" height="50" class="node-rect" style="fill:#1e293b; stroke:#3b82f6;" />
  <text x="265" y="275" class="node-text" style="font-weight:600; fill:#93c5fd;">Clientseitiger JavaScript-Rechner (Vanilla JS)</text>

  <!-- Arrow B -> C -->
  <line x1="265" y1="295" x2="265" y2="330" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Node C: Lokale Berechnung im Browser / DOM Update -->
  <rect x="75" y="340" width="380" height="50" class="node-rect" />
  <text x="265" y="370" class="node-text">Lokale Berechnung &amp; Score-Ausgabe im DOM</text>

  <!-- Boundary Line -->
  <line x1="535" y1="90" x2="535" y2="420" class="boundary-line" />
  <text x="545" y="115" class="boundary-text">VERARBEITUNGSGRENZE</text>

  <!-- Server Zone (Right side) -->
  <rect x="560" y="90" width="215" height="330" fill="#151515" stroke="#222" stroke-width="1" rx="8" />
  <text x="580" y="115" fill="#a3a3a3" font-size="12" font-weight="600" letter-spacing="1">EXTERNAL SERVER</text>

  <!-- Node D: Serverseitiger Analysedienst -->
  <rect x="580" y="245" width="175" height="50" class="node-rect" style="fill:#221515; stroke:#7f1d1d;" />
  <text x="667" y="275" class="node-text" style="fill:#fca5a5; font-size:11px;">Serverseitiger Analysedienst</text>
  <text x="667" y="308" text-anchor="middle" fill="#ef4444" font-size="9px" font-weight="600">FÜR DIESE BERECHNUNG</text>
  <text x="667" y="322" text-anchor="middle" fill="#ef4444" font-size="9px" font-weight="600">NICHT VORGESEHEN</text>

  <!-- Blocked Arrow B -> D -->
  <path d="M 455 270 L 575 270" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-blocked)" />
  <circle cx="515" cy="270" r="14" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" />
  <text x="515" y="274" text-anchor="middle" fill="#ef4444" font-size="14px" font-weight="bold">×</text>

  <!-- Blocked Text description -->
  <rect x="180" y="210" width="380" height="26" fill="#121212" stroke="#ef4444" stroke-width="1" rx="4" />
  <text x="370" y="226" text-anchor="middle" fill="#fca5a5" font-size="8px" font-weight="600">Keine Übertragung der Eingabewerte an einen serverseitigen Analysedienst vorgesehen</text>
</svg>
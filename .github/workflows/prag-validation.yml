name: PRAG Publication Validation

on:
  pull_request:
    branches:
      - main
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: 🔒 PRAG Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📂 Checkout Workspace Validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BGA360/bridgenta-workspace
          path: bridgenta-workspace
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 🔍 Execute PRAG Validation
        run: node bridgenta-workspace/validation/ci_wrapper.js

      - name: 📤 Upload Validation Reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prag-validation-reports
          path: |
            **/validation/validation-report.md
            **/validation/validation-report.json
          if-no-files-found: ignore

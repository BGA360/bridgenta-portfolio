name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers deployment when pushed to main
    paths-ignore:
      - 'stewardship/reports/history/**'
  pull_request:
    branches:
      - main  # Triggers build checks on PRs targeting main
    paths-ignore:
      - 'stewardship/reports/history/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Markdown
        run: npm run lint

      - name: 🔗 Check Markdown Links
        run: npm run check-links

      - name: 🎓 Validate Learning Articles
        run: npm run learning:validate

      - name: 📁 Validate Project Registry
        run: npm run projects:validate

      - name: 🛡️ Scan Project Public Disclosures & Secrets
        run: npm run projects:security-scan

      - name: 🧪 Run Project Registry Tests
        run: npm run test:projects

      - name: 🚀 Build Website
        run: npm run build

      - name: 🛡️ Verify Rendered Output Disclosures
        run: npm run projects:security-scan

      - name: 🕵️ Audit HTML Links
        run: node tooling/audit_links.cjs

      - name: 📤 Upload Artifacts for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  postgres-ci:
    name: 🐘 Standalone PostgreSQL CI Testbed & Role Provisioning
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_DB: becc_testdb
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: ephemeral_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm --prefix packages/governed-learning ci
          npm --prefix packages/governed-learning run build
          npm --prefix becc-runtime ci

      - name: 🏗️ Build BECC Runtime
        run: npm run --prefix becc-runtime build

      - name: 🧪 Run Standalone PostgreSQL & Role Provisioning Testbed
        run: node --test becc-runtime/dist/tests/standalone-postgres-role.test.js
        env:
          STANDALONE_PG_HOST: localhost
          STANDALONE_PG_PORT: 5432
          STANDALONE_PG_DATABASE: becc_testdb
          STANDALONE_ADMIN_USER: postgres_admin
          STANDALONE_ADMIN_PASSWORD: ephemeral_admin_password
          STANDALONE_APP_USER: becc_app
          STANDALONE_APP_PASSWORD: test_app_secure_password_006b

      - name: 🌐 Run HTTP Service Entrypoint Test Suite
        run: node --test becc-runtime/dist/tests/service-entrypoint.test.js

      - name: 🚀 Verify Live Deployed HTTP Service & Endpoints
        run: |
          node becc-runtime/dist/bin/server.js --port=8080 --host=127.0.0.1 &
          SERVER_PID=$!
          echo "Started BECC HTTP Server with PID $SERVER_PID"

          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/health > /dev/null; then
              echo "Server responded on /health!"
              break
            fi
            sleep 1
          done

          echo "Probing /health:"
          HEALTH_RES=$(curl -s http://127.0.0.1:8080/health)
          echo "$HEALTH_RES"
          echo "$HEALTH_RES" | grep -q '"healthState": "HEALTHY"'

          echo "Probing /ready:"
          READY_RES=$(curl -s http://127.0.0.1:8080/ready)
          echo "$READY_RES"
          echo "$READY_RES" | grep -q '"readiness": true'

          echo "Probing /version:"
          VERSION_RES=$(curl -s http://127.0.0.1:8080/version)
          echo "$VERSION_RES"
          echo "$VERSION_RES" | grep -q '"version": "2.0.0-GA"'

          echo "Stopping server gracefully with SIGTERM..."
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
        env:
          BECC_STORAGE_TYPE: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: becc_testdb
          PGUSER: becc_app
          PGPASSWORD: test_app_secure_password_006b
          BECC_RELEASE_SHA: ${{ github.sha }}

      - name: 📋 Generate 006B Test Evidence Report
        if: always()
        run: |
          mkdir -p stewardship/reports
          cat << 'EOF' > stewardship/reports/becc-006b-standalone-ci-evidence.json
          {
            "workstream": "BRIDGENTA-BECC-V2-BECC-NEXT-006B-STANDALONE-POSTGRESQL-CI-CONTAINER-PROVISIONING-01",
            "gitSha": "${{ github.sha }}",
            "postgresImage": "postgres:16.8",
            "postgresVersion": "16.8",
            "networkMode": "TCP",
            "tlsMode": "disable",
            "tlsCertificationClaimed": false,
            "roles": {
              "adminUser": "postgres_admin",
              "appUser": "becc_app",
              "permissions": {
                "SELECT": "ALLOWED",
                "INSERT": "ALLOWED",
                "UPDATE": "DENIED",
                "DELETE": "DENIED",
                "TRUNCATE": "DENIED",
                "DDL": "DENIED",
                "GL_CROSS_SCHEMA": "DENIED"
              }
            },
            "status": "PASS"
          }
          EOF

      - name: 📤 Upload 006B Evidence Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: becc-006b-standalone-ci-evidence
          path: stewardship/reports/becc-006b-standalone-ci-evidence.json
          if-no-files-found: warn

      - name: 📋 Generate 007 Deployed Infrastructure Evidence Report
        if: always()
        run: |
          mkdir -p stewardship/reports
          cat << 'EOF' > stewardship/reports/becc-007-deployed-infrastructure-evidence.json
          {
            "workstream": "BRIDGENTA-BECC-V2-BECC-NEXT-007-DEPLOYED-RUNTIME-INFRASTRUCTURE-FOUNDATION-01",
            "gitSha": "${{ github.sha }}",
            "deploymentTargetClassification": "STATIC_SITE_PLUS_SERVICE_CONTAINER",
            "deployedBeccRuntimeExists": false,
            "runtimeServiceFoundation": {
              "entrypoint": "becc-runtime/bin/server.ts",
              "compiledEntrypoint": "becc-runtime/dist/bin/server.js",
              "httpServerModule": "becc-runtime/server/becc-http-server.ts",
              "cliCommand": "becc serve",
              "status": "IMPLEMENTED_AND_VERIFIED"
            },
            "containerPackaging": {
              "dockerfile": "becc-runtime/Dockerfile",
              "dockerCompose": "becc-runtime/docker-compose.yml",
              "baseImage": "node:22-alpine",
              "executionUser": "node",
              "listenPort": 8080,
              "healthcheckConfigured": true,
              "status": "FOUNDATION_ESTABLISHED"
            },
            "endpoints": {
              "health": {
                "path": "/health",
                "method": "GET",
                "statusCodeHealthy": 200,
                "statusCodeUnhealthy": 503,
                "secretSanitization": "VERIFIED"
              },
              "ready": {
                "path": "/ready",
                "method": "GET",
                "statusCodeReady": 200,
                "statusCodeNotReady": 503,
                "secretSanitization": "VERIFIED"
              },
              "version": {
                "path": "/version",
                "method": "GET",
                "statusCode": 200,
                "reportsVersion": "2.0.0-GA"
              }
            },
            "blockersRemediation": [
              {
                "id": "NEXT006D-BLK-001",
                "control": "Actual Deployed BECC Runtime Existence",
                "status": "FOUNDATION_ESTABLISHED"
              },
              {
                "id": "NEXT006D-BLK-002",
                "control": "Live Remote PostgreSQL & Least-Privilege Role",
                "status": "FOUNDATION_ESTABLISHED"
              },
              {
                "id": "NEXT006D-BLK-003",
                "control": "Live-Reachable Health & Readiness Endpoints",
                "status": "FOUNDATION_ESTABLISHED"
              }
            ],
            "nonClaims": {
              "deployedRuntimeCertified": false,
              "productionCertified": false,
              "tlsCertified": false,
              "multiRegionCertified": false,
              "disasterRecoveryCertified": false,
              "zeroDowntimeCertified": false,
              "zeroDataLossCertified": false,
              "exactlyOnceCertified": false,
              "rtoCertified": false,
              "rpoCertified": false
            },
            "status": "FOUNDATION_ESTABLISHED",
            "safeToClaimDeployedRuntimeCertified": false,
            "safeToClaimProductionCertified": false,
            "safeToMergeNext007Pr": false
          }
          EOF

      - name: 📤 Upload 007 Deployed Infrastructure Evidence Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: becc-007-deployed-infrastructure-evidence
          path: stewardship/reports/becc-007-deployed-infrastructure-evidence.json
          if-no-files-found: warn

  failure-recovery-ci:
    name: 🛡️ BECC-NEXT-006C Deployed Failure, Outage, Recovery & Multi-Instance Certification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm --prefix packages/governed-learning ci
          npm --prefix packages/governed-learning run build
          npm --prefix becc-runtime ci

      - name: 🏗️ Build BECC Runtime
        run: npm run --prefix becc-runtime build

      - name: 🐘 Start Standalone PostgreSQL 16.8 Container
        run: |
          docker run -d --name becc-postgres-006c \
            -p 5432:5432 \
            -e POSTGRES_DB=becc_testdb \
            -e POSTGRES_USER=postgres_admin \
            -e POSTGRES_PASSWORD=ephemeral_admin_password \
            postgres:16.8
          until docker exec becc-postgres-006c pg_isready -h localhost -p 5432 -U postgres_admin; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: 🛡️ Run BECC-NEXT-006C Deployed Failure, Outage, Recovery & Multi-Instance Certification
        run: node --test becc-runtime/dist/tests/deployed-failure-recovery.test.js
        env:
          STANDALONE_PG_HOST: localhost
          STANDALONE_PG_PORT: 5432
          STANDALONE_PG_DATABASE: becc_testdb
          STANDALONE_ADMIN_USER: postgres_admin
          STANDALONE_ADMIN_PASSWORD: ephemeral_admin_password
          STANDALONE_APP_USER: becc_app
          STANDALONE_APP_PASSWORD: test_app_secure_password_006b
          STANDALONE_CONTAINER_NAME: becc-postgres-006c

      - name: 🧹 Cleanup Container
        if: always()
        run: docker rm -f becc-postgres-006c || true

      - name: 📤 Upload 006C Evidence Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: becc-006c-failure-recovery-certification-evidence
          path: stewardship/reports/becc-006c-failure-recovery-evidence.json
          if-no-files-found: warn

  m5-shadow:
    name: 🕵️ M5 Shadow Observation
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🕵️ Run M5 Shadow Observation
        run: npm run m5:shadow

      - name: 📤 Upload M5 Shadow Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-shadow-observation
          path: stewardship/reports/m5-ci-shadow-observation.json
          if-no-files-found: warn

  m5-retain:
    name: 🗃️ M5 Shadow Observation Retention
    runs-on: ubuntu-latest
    needs: m5-shadow
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download M5 Shadow Report
        uses: actions/download-artifact@v4
        with:
          name: m5-shadow-observation
          path: stewardship/reports

      - name: 🗃️ Retain M5 Shadow Observation in History
        run: npm run m5:retain

      - name: 📤 Push Retained Observation to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stewardship/reports/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore: retain M5 shadow observation [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new shadow observation to retain."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, postgres-ci, failure-recovery-ci]
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

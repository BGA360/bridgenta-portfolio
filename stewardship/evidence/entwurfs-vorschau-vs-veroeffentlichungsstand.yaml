articleId: "entwurfs-vorschau-vs-veroeffentlichungsstand"
workingTitle: "Entwurfs-Vorschau vs. Veröffentlichungsstand: Sichere Sichtprüfung ohne Frühveröffentlichung"
learningLevel: "intermediate"
category: "softwarearchitektur"
centralLesson: "Unveröffentlichte Content-Entwürfe dürfen nicht in öffentlichen Routing-Kollektionen auftauchen, um Frühveröffentlichungen zu vermeiden. Eine dedizierte Vorschau-Route (/preview/[slug]) erlaubt die vollständige visuelle Sichtprüfung bei strikter Trennung vom öffentlichen Produktions-Index."


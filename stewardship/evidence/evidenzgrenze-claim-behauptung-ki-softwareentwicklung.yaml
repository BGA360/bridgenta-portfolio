articleId: "evidenzgrenze-claim-behauptung-ki-softwareentwicklung"
workingTitle: "Wo die Evidenz endet, muss der Claim enden: KI-Diagnosen und Beleggrenzen"
learningLevel: "intermediate"
category: "ai-entwicklung"
centralLesson: "Plausible KI-Erklärungen ersetzen in der Software-Entwicklung keine nachgewiesenen Belege. Wo die Evidenz endet, muss der behauptete Claim enden."

claims:
  - id: "CLM-001"
    statement: "Das didaktische Prinzip 'Wo Evidenz endet, muss der Claim enden' bestimmt die Abgrenzung spekulativer Erklärungen gegenüber nachgewiesenen Belegen."
    sourceType: "STANDARD"
    sourceLocator: "docs/becc/standards/BECC-PUBLIC-LEARNING-STANDARD-v1.0.md"
    historicalLocator: "ea17fab39a8ebfeebc8a4eb4ea6283ffb5f082bb"
    evidenceClass: "SPECIFICATION"
    publicWordingBoundary: "Die methodische Regel verlangt, dass Aussagen streng an vorhandene Evidenz gebunden sind."
  - id: "CLM-002"
    statement: "Das beobachtete Fallbeispiel (WordPress-Plugin, Login/UI-Schritte vs. spekulative KI-Diagnosen) stützt sich auf Gesprächs-Erinnerung und Abwesenheit dauerhafter Repository-Protokolle."
    sourceType: "CHAT_MEMORY"
    sourceLocator: "NONE"
    historicalLocator: "NOT_AVAILABLE"
    evidenceClass: "CONVERSATIONAL_RECOLLECTION"
    publicWordingBoundary: "Ablaufschritte und spekulative KI-Vorschläge werden im Artikel explizit als erinnerte Beobachtungen und nicht als dauerhaft protokollierte SSoT-Fakten gerahmt."
  - id: "CLM-003"
    statement: "In den geprüften Projektquellen lag kein Beleg für ein Tenant- oder Workspace-Modell vor, weshalb die Ursache 'nicht belegt' lautet."
    sourceType: "ABSENCE_STATE"
    sourceLocator: "NONE"
    historicalLocator: "NOT_AVAILABLE"
    evidenceClass: "INFERENCE"
    publicWordingBoundary: "Das Fehlen eines Belegs führt zur präzisen Einstufung 'nicht belegt' statt zu unbelegten Ausschluss-Behauptungen."

unsupportedOrOpenClaims: "Es wird nicht behauptet, dass KI-Modelle keine nützlichen Hypothesen liefern, dass Fehlerdiagnosen grundsätzlich unmöglich sind oder dass für das konkrete Fallbeispiel ein dauerhaftes Repository-Protokoll existiert."
transferabilityBoundary: "Das Prinzip 'Wo Evidenz endet, muss der Claim enden' dient als übertragbare Leitregel für evidenzbasierte Fehlersuche und Qualitätssicherung in der Softwareentwicklung."

